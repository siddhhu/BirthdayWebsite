# Render Blueprint — static site (no build step)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect GitHub repo
# Or: New → Static Site → use settings below manually

services:
  - type: web
    name: our-little-universe
    runtime: static
    buildCommand: "true"
    staticPublishPath: .
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.js
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.css
        name: Cache-Control
        value: public, max-age=3600
